services:
  ai-localization:
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: pingo-ai-localization-cuda:${AI_IMAGE_TAG:-local}
    container_name: pingo-ai-localization-gpu
    restart: unless-stopped
    ports:
      - "${AI_HOST_BIND_ADDRESS:-127.0.0.1}:${AI_HOST_PORT:-8000}:8000"
    environment:
      AI_DEVICE: cuda
      AI_MAP_SET_VERSION: ${AI_MAP_SET_VERSION:?AI_MAP_SET_VERSION is required}
      AI_MAP_ROOT: /maps
      AI_MAP_VERSIONS: ${AI_MAP_VERSIONS:?AI_MAP_VERSIONS is required}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:?AI_INTERNAL_TOKEN is required}
      AI_MAX_CONCURRENT_INFERENCES: ${AI_MAX_CONCURRENT_INFERENCES:-1}
      AI_MAX_QUEUE_SIZE: ${AI_MAX_QUEUE_SIZE:-2}
      AI_QUERY_RESIZE_MAX: ${AI_QUERY_RESIZE_MAX:-1280}
      AI_PORTRAIT_INITIAL_TOP_K: ${AI_PORTRAIT_INITIAL_TOP_K:-5}
      AI_PORTRAIT_RETRY_TOP_K: ${AI_PORTRAIT_RETRY_TOP_K:-20}
      AI_LANDSCAPE_TOP_K: ${AI_LANDSCAPE_TOP_K:-5}
      AI_MAX_TOP_K: ${AI_MAX_TOP_K:-50}
    volumes:
      - ${AI_MAPS_HOST_PATH:-./runtime_maps}:/maps:ro
      - ${AI_MODEL_CACHE_HOST_PATH:-./model-cache}:/opt/pingo/model-cache:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 10m
      retries: 3

  model-prepare:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile.cuda
    image: pingo-ai-localization-cuda:${AI_IMAGE_TAG:-local}
    environment:
      TORCH_HOME: /opt/pingo/model-cache
    volumes:
      - ${AI_MODEL_CACHE_HOST_PATH:-./model-cache}:/opt/pingo/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    command:
      - python
      - tools/download_model_weights.py
      - --device
      - cuda

