[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pingo-localization"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "h5py>=3.12,<4",
  "hloc @ git+https://github.com/cvg/Hierarchical-Localization.git@c13273bd0ecc2917a35910fd843712a1c6243193",
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<5",
  "Pillow>=11,<12",
  "python-multipart>=0.0.20,<1",
  "pycolmap==3.13.0",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "kornia>=0.7,<1",
  "lightglue @ git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.7,<3",
  "pytest>=8,<9",
]
map-build = [
  "opencv-python>=4.10,<5",
  "scipy>=1.13,<2",
  "tqdm>=4.66,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
