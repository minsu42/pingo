services:
  mysql:
    image: mysql:8.4
    container_name: pingo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pingo
      MYSQL_USER: pingo
      MYSQL_PASSWORD: pingo
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - pingo-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  coturn:
    image: coturn/coturn:4
    container_name: pingo-coturn
    restart: unless-stopped
    profiles:
      - webrtc
    network_mode: host
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf

volumes:
  pingo-mysql-data:
