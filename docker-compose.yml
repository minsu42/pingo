services:
  mysql:
    image: mysql:8.4
    container_name: pingo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pingo
      MYSQL_USER: pingo
      MYSQL_PASSWORD: pingo
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - pingo-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  pingo-mysql-data: