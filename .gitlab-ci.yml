stages:
  - test

backend-test:
  stage: test
  image: eclipse-temurin:17-jdk
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    MYSQL_DATABASE: pingo
    MYSQL_USER: pingo
    MYSQL_PASSWORD: pingo
    MYSQL_ROOT_PASSWORD: root
    SPRING_PROFILES_ACTIVE: ci
    SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/pingo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
    SPRING_DATASOURCE_USERNAME: pingo
    SPRING_DATASOURCE_PASSWORD: pingo
    SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    SPRING_FLYWAY_ENABLED: "true"
  cache:
    key: backend-gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper
  before_script:
    - chmod +x backend/gradlew
    - bash -lc 'for i in {1..30}; do echo > /dev/tcp/mysql/3306 && exit 0 || sleep 2; done; exit 1'
  script:
    - ./backend/gradlew -p backend compileJava
    - ./backend/gradlew -p backend test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
